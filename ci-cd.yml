name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 3. Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest bandit safety pip-audit

      - name: 4. Lint Backend with Ruff
        run: ruff check backend/app

      - name: 5. Type Check Backend with MyPy
        run: mypy backend/app
      
      - name: 6. Scan Backend with Bandit
        run: bandit -r backend -ll -x backend/tests

      - name: 7. Scan Backend with Safety
        run: safety check -r backend/requirements.txt

      - name: 8. Audit Backend dependencies with pip-audit
        run: pip-audit -r backend/requirements.txt

      - name: 9. Run Backend Tests with Pytest
        run: >
          pytest tests/backend --cov=backend/app --cov-report=xml --cov-fail-under=90

      - name: 10. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 11. Install Frontend Dependencies
        run: npm install

      - name: 12. Lint & Type Check Frontend
        run: npm run lint

      - name: 13. Run E2E Tests with Playwright
        run: npx playwright test tests/e2e


  build-and-scan:
    name: Build & Scan Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Only run on push to main or develop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Scan for Secrets with Gitleaks
        uses: zricethezav/gitleaks-action@v1
        with:
          config: .gitleaks.toml # Optional: custom Gitleaks config
      - name: 4. Define Image Tags
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=latest" >> $GITHUB_OUTPUT
          else
            echo "tags=develop" >> $GITHUB_OUTPUT
          fi

      - name: 5. Build and Push Backend Image (Multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: yourdockerhub/upjt-backend:${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64 # Build for multiple architectures

      - name: 6. Build and Push Nginx/Frontend Image (Multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: yourdockerhub/upjt-nginx:${{ steps.meta.outputs.tags }}
      - name: 7. Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'yourdockerhub/upjt-backend:${{ steps.meta.outputs.tags }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Fail pipeline on critical/high vulnerabilities

  deploy:
    name: Deploy to Production
    needs: build-and-scan
    runs-on: self-hosted # IMPORTANT: This must be a self-hosted runner on your server
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production # Use GitHub Environments for better control
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up .env file
        run: |
          # Ensure .env.production exists on the self-hosted runner
          # This step assumes the .env.production file is securely managed on the runner
          # and not checked into source control.
          if [ ! -f .env.production ]; then
            echo "Error: .env.production file not found on the self-hosted runner."
            echo "Deployment cannot proceed without production environment variables."
            exit 1
          fi
          # Symlink or copy .env.production to .env for docker compose
          ln -sf .env.production .env

      - name: 3. Pull Latest Images
        run: docker compose -f docker-compose.prod.yml pull

      - name: 4. Deploy Services
        run: |
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          sleep 5 # Give services a moment to start

      - name: 5. Run Database Migrations
        run: |
          # Run migrations using the backend service's entrypoint
          docker compose -f docker-compose.prod.yml exec -T backend /bin/sh -c "alembic upgrade head"

      - name: 6. Verify Deployment Health
        run: |
          echo "Running smoke tests and health checks..."
          # Check if all services are running and healthy
          docker compose -f docker-compose.prod.yml ps --services --filter "status=running" | wc -l | grep -q 8 # Assuming 8 services
          docker compose -f docker-compose.prod.yml ps --services --filter "health=healthy" | wc -l | grep -q 8 # Assuming 8 services
          
          # Basic HTTP health check on Nginx
          curl -f http://localhost/api/v1/health || exit 1
          echo "Deployment successful and services are healthy!"

      - name: 7. Rollback (Manual Trigger/Placeholder)
        if: failure() # Only run if previous steps failed
        run: |
          echo "Deployment failed. Initiating rollback procedure..."
          # In a real scenario, this would involve:
          # 1. Reverting to the previous successful image tags.
          # 2. Running docker compose up -d with previous images.
          # 3. Potentially running alembic downgrade if migrations were destructive.
          # For now, this is a manual intervention point.
          echo "Please manually rollback to the previous stable version."
          exit 1 # Fail the job to indicate rollback is needed