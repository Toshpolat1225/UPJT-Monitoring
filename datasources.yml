apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090 # Prometheus service name in docker-compose
    isDefault: true
    version: 1
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: Prometheus # Link to Prometheus datasource
          matcherRegex: 'traceID=(\w+)'
          name: TraceID
          url: '$${__value.raw}'