# This is a minimal config file for production.
# For a full list of options, see the official PostgreSQL documentation.

listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB

# --- WAL Archiving for Point-in-Time Recovery (PITR) ---
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal-archive/%f'
wal_level = replica