services:
  db:
    image: postgres:15-alpine
    container_name: upjt_db_prod
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - fuel_postgres_data:/var/lib/postgresql/data/pgdata
      - fuel_wal_archive:/var/lib/postgresql/wal-archive
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./src/postgres-pg_hba.prod.conf:/etc/postgresql/pg_hba.prod.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.prod.conf -D /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuel_internal
      - fuel_default

  redis:
    image: redis:7-alpine
    container_name: upjt_redis_prod
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - fuel_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuel_internal

  backend:
    image: fuel-backend-local
    container_name: upjt_backend_prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fuel_internal

  backup-service:
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: upjt_backup_prod
    user: "1000:1000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - fuel_internal

  nginx:
    image: fuel-nginx-local
    container_name: upjt_nginx_prod
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - fuel_certbot_conf:/etc/letsencrypt
      - fuel_certbot_www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - fuel_internal
      - fuel_default

  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: upjt_prometheus_prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - fuel_prometheus_data:/prometheus
      - ./src/monitoring-prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - fuel_internal
      - fuel_default

  promtail:
    image: grafana/promtail:2.9.2
    container_name: upjt_promtail_prod
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./src/monitoring-promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    restart: unless-stopped
    networks:
      - fuel_internal

volumes:
  fuel_postgres_data:
    external: true
  fuel_wal_archive:
    external: true
  fuel_redis_data:
    external: true
  fuel_certbot_conf:
    external: true
  fuel_certbot_www:
    external: true
  fuel_prometheus_data:
    external: true

networks:
  fuel_internal:
    name: fuel_internal
    internal: true
  fuel_default:
    name: fuel_default
